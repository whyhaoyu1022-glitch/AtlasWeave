[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "atlasweave"
version = "0.1.0.dev0"
description = "疆理 AtlasWeave — fictional administrative map editor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyQt6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.9,<1", "build>=1.2,<2", "hatchling>=1.27,<2"]

[project.gui-scripts]
atlasweave = "atlasweave.app.application:main"

[tool.hatch.build.targets.wheel]
packages = ["atlasweave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
