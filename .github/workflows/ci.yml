name: Desktop and domain checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 fonts-noto-cjk
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen --extra dev
      - name: Static checks
        run: |
          uv run --frozen --extra dev ruff check .
          uv run --frozen --extra dev ruff format --check .
      - name: Automated tests
        run: uv run --frozen --extra dev pytest --junitxml=test-results/pytest.xml
      - name: Real window smoke test
        run: uv run --frozen --extra dev python -m atlasweave --smoke-test --data-dir local-data --screenshot test-results/m0-window.png
      - name: Build distributions
        run: uv build --no-build-isolation
      - name: Verify installed wheel outside source tree
        run: uv run --frozen --extra dev python scripts/verify_wheel.py
      - name: Upload evidence and distributions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlasweave-${{ matrix.os }}
          path: |
            test-results/
            dist/
          if-no-files-found: warn
